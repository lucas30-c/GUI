# GenUI 后端包：DSL 契约与确定性校验（M1-01）
# 依赖边界：仅 pydantic(v2) 运行依赖 + pytest 开发依赖（任务书授权）
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genui-api"
version = "0.1.0"
description = "GenUI controlled prototype backend: DSL v0.1 contracts and deterministic validation"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
